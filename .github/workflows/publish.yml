name: Publish to AMO

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds .output/firefox-mv2 and the AMO sources zip that publish uploads.
      - run: npm run zip
      - run: npm run lint
      # web-ext sign --source-dir .output/firefox-mv2 --upload-source-code <sources zip>
      - run: npm run publish
        env:
          WEB_EXT_API_KEY: ${{ secrets.MOZILLA_ADDONS_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.MOZILLA_ADDONS_JWT_SECRET }}
