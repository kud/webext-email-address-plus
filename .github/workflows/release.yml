name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The shared workflow does not lint, so the build is checked here first.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  release:
    needs: lint
    uses: kud/webext/.github/workflows/release-extension.yml@main
    secrets: inherit
