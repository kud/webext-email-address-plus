name: Release

# Run by hand from main once the version bump is committed there. The shared
# workflow checks the branch, the version and the tag, signs, then tags
# v<version> itself unless that tag already points at the released commit.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as committed in package.json"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The shared workflow does not lint, so the build is checked here first.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  release:
    needs: lint
    uses: kud/webext/.github/workflows/release-extension.yml@main
    with:
      version: ${{ inputs.version }}
    secrets: inherit
