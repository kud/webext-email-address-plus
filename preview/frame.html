<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Email Address Plus demo frame</title>
  </head>
  <body>
    <script>
      // Loads the extension's REAL page (entrypoints/<page>/index.html and its
      // bundled main.js) with the browser shim in front of it.
      //   ?page=popup|options
      //   ?site=<url>  the tab the popup believes it was opened on
      const params = new URLSearchParams(location.search)
      const page = params.get("page") === "options" ? "options" : "popup"
      const frameDir = new URL("./", location.href)
      const pageDir = new URL(`../entrypoints/${page}/`, location.href)

      // The real popup closes itself after four seconds, which would leave
      // the demo with an empty frame, so its timer bar is hidden here and
      // window.close is a no-op (see browser-shim.js).
      const demoStyle =
        page === "popup" ? "<style>.autoclose{display:none}</style>" : ""

      const load = async () => {
        const html = await (await fetch(new URL("index.html", pageDir))).text()
        const injected =
          `<head><base href="${pageDir.href}" />` +
          demoStyle +
          `<script src="${new URL("browser-shim.js", frameDir).href}"><\/script>`
        document.open()
        document.write(html.replace("<head>", injected))
        document.close()
      }

      load()
    </script>
  </body>
</html>
