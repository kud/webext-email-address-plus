<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Email Address Plus demo</title>
    <style>
      :root {
        --page-bg: #f3f3f5;
        --page-fg: #1b1b1f;
        --page-muted: #62626b;
        --page-line: #d6d6dc;
        --page-link: #0b5fd6;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #17171a;
          --page-fg: #ececf0;
          --page-muted: #9a9aa5;
          --page-line: #34343b;
          --page-link: #7fb0ff;
        }
      }
      body {
        margin: 0;
        padding: 32px 16px 64px;
        background: var(--page-bg);
        color: var(--page-fg);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: var(--page-muted);
      }
      a {
        color: var(--page-link);
      }
      .stage {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: center;
        gap: 32px;
        margin-top: 32px;
      }
      figure {
        margin: 0;
        max-width: 100%;
      }
      figcaption {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 12px;
        color: var(--page-muted);
      }
      figcaption select,
      figcaption button {
        font: inherit;
        color: var(--page-fg);
        background: transparent;
        border: 1px solid var(--page-line);
        border-radius: 6px;
        padding: 2px 8px;
      }
      iframe {
        display: block;
        max-width: 100%;
        border: 1px solid var(--page-line);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Email Address Plus</h1>
      <p>
        Labelled email addresses for every site, in your own inbox. The real
        popup and settings page, running on invented data.
        <a href="https://addons.mozilla.org/firefox/addon/email-address-plus/"
          >Get it on Mozilla Add-ons</a
        >.
      </p>
      <div class="stage">
        <figure>
          <figcaption>
            <span>Popup on</span>
            <select id="site" aria-label="Site the popup opens on"></select>
            <button type="button" id="reopen">Open again</button>
            <span>(it stays open here instead of closing after 4s)</span>
          </figcaption>
          <iframe
            id="popup"
            title="Email Address Plus popup"
            allow="clipboard-write"
          ></iframe>
        </figure>
        <figure>
          <figcaption>Settings, saved as you type</figcaption>
          <iframe id="options" title="Email Address Plus settings"></iframe>
        </figure>
      </div>
    </main>
    <script>
      const popup = document.getElementById("popup")
      const options = document.getElementById("options")
      const site = document.getElementById("site")

      // Frames are sized to their page, like the browser sizes the real popup.
      const fit = (frame) => {
        const doc = frame.contentDocument
        if (!doc?.documentElement) return
        const root = doc.documentElement
        frame.style.width = `${Math.max(root.scrollWidth, 320)}px`
        frame.style.height = `${root.scrollHeight}px`
      }
      for (const frame of [popup, options]) {
        frame.addEventListener("load", () => {
          fit(frame)
          new ResizeObserver(() => fit(frame)).observe(
            frame.contentDocument.documentElement,
          )
        })
      }

      const openPopup = () => {
        popup.src = `frame.html?page=popup&site=${encodeURIComponent(site.value)}`
      }

      options.src = "frame.html?page=options"
      fetch("fixtures/demo.json")
        .then((response) => response.json())
        .then(({ sites }) => {
          for (const url of sites) {
            const option = document.createElement("option")
            option.value = url
            option.textContent = new URL(url).hostname
            site.append(option)
          }
          openPopup()
        })

      site.addEventListener("change", openPopup)
      document.getElementById("reopen").addEventListener("click", openPopup)

      // The popup's Settings button: the settings page is already on screen.
      window.addEventListener("message", (event) => {
        if (event.data?.demo === "openOptionsPage") {
          options.scrollIntoView({ behavior: "smooth", block: "nearest" })
          options.contentWindow?.focus()
        }
      })
    </script>
  </body>
</html>
