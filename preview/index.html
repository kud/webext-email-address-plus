<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Email Address Plus preview</title>
    <style>
      :root {
        --page-bg: #f3f3f5;
        --page-fg: #1b1b1f;
        --page-muted: #62626b;
        --page-line: #d6d6dc;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #17171a;
          --page-fg: #ececf0;
          --page-muted: #9a9aa5;
          --page-line: #34343b;
        }
      }
      body {
        margin: 0;
        padding: 32px 16px 64px;
        background: var(--page-bg);
        color: var(--page-fg);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      h2 {
        margin: 40px 0 12px;
        font-size: 16px;
      }
      p {
        margin: 0;
        color: var(--page-muted);
      }
      .pair {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-bottom: 8px;
        font-size: 12px;
        color: var(--page-muted);
      }
      iframe {
        display: block;
        border: 1px solid var(--page-line);
        border-radius: 8px;
        background: #fff;
      }
      iframe.popup {
        width: 360px;
        height: 600px;
      }
      iframe.options {
        width: 480px;
        height: 800px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Email Address Plus preview</h1>
      <p>
        The real popup and options pages, running on fixture data. Clicks and
        edits change state in memory only; writes are logged to each frame's
        console.
      </p>
      <div id="gallery"></div>
    </main>
    <script>
      const sections = [
        [
          "popup",
          "typical",
          "Popup, typical: labelled address copied, recent rows",
        ],
        ["popup", "long", "Popup, long: full-domain label on a long address"],
        ["popup", "missing", "Popup, missing: no address set yet"],
        ["options", "typical", "Options, typical: address set"],
        ["options", "missing", "Options, first run: placeholder examples"],
        ["options", "invalid", "Options, invalid: error line under the field"],
      ]
      const gallery = document.getElementById("gallery")
      for (const [page, fixture, label] of sections) {
        const section = document.createElement("section")
        section.innerHTML = `<h2>${label}</h2><div class="pair"></div>`
        for (const scheme of ["light", "dark"]) {
          const figure = document.createElement("figure")
          figure.innerHTML = `<figcaption>${fixture} / ${scheme}</figcaption>`
          const frame = document.createElement("iframe")
          frame.className = page
          frame.src = `frame.html?page=${page}&fixture=${fixture}&scheme=${scheme}`
          frame.title = `${page} ${fixture} fixture, ${scheme}`
          figure.append(frame)
          section.querySelector(".pair").append(figure)
        }
        gallery.append(section)
      }
    </script>
  </body>
</html>
