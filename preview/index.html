<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Email Address Plus demo</title>
    <style>
      :root {
        --page-bg: #f3f3f5;
        --page-fg: #1b1b1f;
        --page-muted: #62626b;
        --page-line: #d6d6dc;
        --page-link: #0b5fd6;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #17171a;
          --page-fg: #ececf0;
          --page-muted: #9a9aa5;
          --page-line: #34343b;
          --page-link: #7fb0ff;
        }
      }
      body {
        margin: 0;
        padding: 32px 16px 64px;
        background: var(--page-bg);
        color: var(--page-fg);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: var(--page-muted);
      }
      a {
        color: var(--page-link);
      }
      .stage {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: center;
        gap: 32px;
        margin-top: 32px;
      }
      figure {
        margin: 0;
        max-width: 100%;
      }
      figcaption {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 12px;
        color: var(--page-muted);
      }
      figcaption select,
      figcaption button {
        font: inherit;
        color: var(--page-fg);
        background: transparent;
        border: 1px solid var(--page-line);
        border-radius: 6px;
        padding: 2px 8px;
      }
      .toolbars {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }
      .toolbar {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 4px 8px;
        border-radius: 8px;
      }
      .toolbar.light {
        background: #f9f9fb;
        color: #15141a;
      }
      .toolbar.dark {
        background: #2b2a33;
        color: #fbfbfe;
      }
      .toolbar span {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 4px;
      }
      .toolbar svg,
      .toolbar img {
        display: block;
        width: 16px;
        height: 16px;
      }
      .toolbar.large span {
        width: 64px;
        height: 64px;
        border-radius: 8px;
      }
      .toolbar.large img {
        width: 48px;
        height: 48px;
      }
      iframe {
        display: block;
        max-width: 100%;
        border: 1px solid var(--page-line);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Email Address Plus</h1>
      <p>
        Labelled email addresses for every site, in your own inbox. The real
        popup and settings page, running on invented data.
        <a href="https://addons.mozilla.org/firefox/addon/email-address-plus/"
          >Get it on Mozilla Add-ons</a
        >.
      </p>
      <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <defs>
          <symbol id="ff-star" viewBox="0 0 16 16">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
              d="M8 1.9l1.9 3.8 4.2.6-3 3 .7 4.2L8 11.5l-3.8 2 .7-4.2-3-3 4.2-.6z"
            />
          </symbol>
          <symbol id="ff-puzzle" viewBox="0 0 16 16">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
              d="M2.5 5h3a1.6 1.6 0 1 1 3.2 0h2.8v2.8a1.6 1.6 0 1 1 0 3.2V13.5h-9z"
            />
          </symbol>
          <symbol id="ff-menu" viewBox="0 0 16 16">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              d="M2.5 4h11M2.5 8h11M2.5 12h11"
            />
          </symbol>
        </defs>
      </svg>
      <figure class="toolbars" aria-label="Toolbar button">
        <div class="toolbar light">
          <span
            ><svg><use href="#ff-star" /></svg
          ></span>
          <span
            ><img
              src="../public/icons/icon.svg"
              alt="Email Address Plus, light toolbar"
          /></span>
          <span
            ><svg><use href="#ff-puzzle" /></svg
          ></span>
          <span
            ><svg><use href="#ff-menu" /></svg
          ></span>
        </div>
        <div class="toolbar dark">
          <span
            ><svg><use href="#ff-star" /></svg
          ></span>
          <span
            ><img
              src="../public/icons/icon-dark.svg"
              alt="Email Address Plus, dark toolbar"
          /></span>
          <span
            ><svg><use href="#ff-puzzle" /></svg
          ></span>
          <span
            ><svg><use href="#ff-menu" /></svg
          ></span>
        </div>
        <div class="toolbar light large">
          <span><img src="../public/icons/icon.svg" alt="" /></span>
        </div>
        <div class="toolbar dark large">
          <span><img src="../public/icons/icon-dark.svg" alt="" /></span>
        </div>
      </figure>
      <div class="stage">
        <figure>
          <figcaption>
            <span>Popup on</span>
            <select id="site" aria-label="Site the popup opens on"></select>
            <button type="button" id="reopen">Open again</button>
            <span>(it stays open here instead of closing after 4s)</span>
          </figcaption>
          <iframe
            id="popup"
            title="Email Address Plus popup"
            allow="clipboard-write"
          ></iframe>
        </figure>
        <figure>
          <figcaption>Settings, saved as you type</figcaption>
          <iframe id="options" title="Email Address Plus settings"></iframe>
        </figure>
      </div>
    </main>
    <script>
      const popup = document.getElementById("popup")
      const options = document.getElementById("options")
      const site = document.getElementById("site")

      // Frames are sized to their page, like the browser sizes the real popup.
      const fit = (frame) => {
        const doc = frame.contentDocument
        if (!doc?.documentElement) return
        const root = doc.documentElement
        frame.style.width = `${Math.max(root.scrollWidth, 320)}px`
        frame.style.height = `${root.scrollHeight}px`
      }
      for (const frame of [popup, options]) {
        frame.addEventListener("load", () => {
          fit(frame)
          new ResizeObserver(() => fit(frame)).observe(
            frame.contentDocument.documentElement,
          )
        })
      }

      const openPopup = () => {
        popup.src = `frame.html?page=popup&site=${encodeURIComponent(site.value)}`
      }

      options.src = "frame.html?page=options"
      fetch("fixtures/demo.json")
        .then((response) => response.json())
        .then(({ sites }) => {
          for (const url of sites) {
            const option = document.createElement("option")
            option.value = url
            option.textContent = new URL(url).hostname
            site.append(option)
          }
          openPopup()
        })

      site.addEventListener("change", openPopup)
      document.getElementById("reopen").addEventListener("click", openPopup)

      // The popup's Settings button: the settings page is already on screen.
      window.addEventListener("message", (event) => {
        if (event.data?.demo === "openOptionsPage") {
          options.scrollIntoView({ behavior: "smooth", block: "nearest" })
          options.contentWindow?.focus()
        }
      })
    </script>
  </body>
</html>
