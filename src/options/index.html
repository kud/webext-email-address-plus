<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Email Address Plus — Options</title>
    <link rel="stylesheet" href="../vendor/tokens.css" />
    <link rel="stylesheet" href="../vendor/webext-ui.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body class="page">
    <div class="card stack">
      <label class="field">
        <span>Email address <span class="required">*</span></span>
        <input type="email" id="email" required />
      </label>

      <label class="field">
        <span>Domain label mode</span>
        <select id="domainMode">
          <option value="main">Main domain (example.com)</option>
          <option value="short">Short (example)</option>
          <option value="full">Full domain (www.example.com)</option>
        </select>
      </label>

      <div class="field" id="preview-group" hidden>
        <span>Preview</span>
        <div id="email-preview" class="email-preview"></div>
      </div>

      <label class="field-inline">
        <input type="checkbox" id="showHistory" class="checkbox-input" />
        Show recent emails history in popup
      </label>

      <label class="field-inline">
        <input type="checkbox" id="showFloatingIcon" class="checkbox-input" />
        Show floating icon on input fields
      </label>

      <div id="save-status" class="save-status" hidden>
        <span class="save-indicator badge badge-success">Saved</span>
      </div>
    </div>

    <p class="spoiler">
      <span class="required">*</span> The email address is only saved on this
      computer.
    </p>

    <script src="index.js"></script>
  </body>
</html>
