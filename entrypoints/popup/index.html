<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Email Copied</title>
    <meta name="color-scheme" content="light dark" />
  </head>
  <body class="popup stack">
    <div class="autoclose" aria-hidden="true"><span></span></div>
    <h1 id="card-title" class="title">Email address copied</h1>
    <p id="card-subtitle" class="status"></p>

    <section id="history-section" hidden>
      <h2 class="section-title">Recent</h2>
      <div id="history-list" class="history-list"></div>
    </section>

    <div class="action-bar">
      <button type="button" class="row-bleed action" id="settings-btn">
        <span>Settings</span>
        <svg
          aria-hidden="true"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 3.5l4.5 4.5L6 12.5" />
        </svg>
      </button>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
