<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Email Address Plus — Options</title>
    <meta name="manifest.browser_style" content="true" />
  </head>

  <body class="page">
    <div class="settings">
      <div class="settings-head">
        <h2 class="settings-heading">Your address</h2>
        <div id="save-status" class="save-status hint" role="status">
          <span class="save-indicator">
            <svg
              aria-hidden="true"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3.5 8.5l3 3 6-7" />
            </svg>
            Saved
          </span>
        </div>
      </div>

      <label class="field">
        <span class="visually-hidden">Email address</span>
        <input
          type="email"
          id="email"
          required
          aria-describedby="email-note email-error"
        />
      </label>
      <span class="field-note" id="email-note">
        Saved on this computer only.
      </span>
      <span class="field-error" id="email-error" hidden>
        Enter a full address, like alex@example.org.
      </span>

      <fieldset class="choice-list rows-divided">
        <legend class="settings-heading">Label to add</legend>
        <label class="choice">
          <input type="radio" name="domainMode" value="main" />
          <span class="choice-text">
            <span>Main domain</span>
            <span class="choice-example" data-mode="main"></span>
          </span>
        </label>
        <label class="choice">
          <input type="radio" name="domainMode" value="short" />
          <span class="choice-text">
            <span>Short</span>
            <span class="choice-example" data-mode="short"></span>
          </span>
        </label>
        <label class="choice">
          <input type="radio" name="domainMode" value="full" />
          <span class="choice-text">
            <span>Full domain</span>
            <span class="choice-example" data-mode="full"></span>
          </span>
        </label>
        <p class="field-note">Shown for a page on www.shop.example.com.</p>
      </fieldset>

      <div class="field-group">
        <h2 class="settings-heading">Popup and page</h2>
        <div class="rows-divided toggle-list">
          <label class="row">
            <span>Recent addresses in the popup</span>
            <span class="switch">
              <input type="checkbox" id="showHistory" />
              <span class="track"><span class="thumb"></span></span>
            </span>
          </label>
          <label class="row">
            <span>Icon inside email fields</span>
            <span class="switch">
              <input type="checkbox" id="showFloatingIcon" />
              <span class="track"><span class="thumb"></span></span>
            </span>
          </label>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
